[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tyde-research"
version = "0.1.1"
description = "A minimal research prototype for selective state updates in long-running agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Yufeng Liang"}]
keywords = ["agents", "memory", "planning", "state-management", "research"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools]
packages = ["tyde"]
