<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">TYDE selective state update mechanism</title>
  <desc id="desc">Three interaction classes demonstrate selective persistence: irrelevant dialogue is ignored, a current fact replaces obsolete state, and a material project update revises downstream action.</desc>
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#31465a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#aab5c0"/>
    </marker>
    <style>
      .title { font: 700 28px Inter, Arial, sans-serif; fill: #26384b; }
      .header { font: 700 18px Inter, Arial, sans-serif; fill: #6d7d8e; }
      .row-title { font: 700 23px Inter, Arial, sans-serif; fill: #1f2d3d; }
      .row-title-green { font: 700 23px Inter, Arial, sans-serif; fill: #258454; }
      .subtitle { font: 400 17px Inter, Arial, sans-serif; fill: #6d7d8e; }
      .node { font: 600 17px Inter, Arial, sans-serif; fill: #26384b; }
      .node-small { font: 500 14px Inter, Arial, sans-serif; fill: #617286; }
      .result { font: 700 22px Inter, Arial, sans-serif; fill: #607286; }
      .result-green { font: 700 22px Inter, Arial, sans-serif; fill: #258454; }
      .caption { font: italic 600 15px Inter, Arial, sans-serif; fill: #6c7c8d; }
      .arrow { fill: none; stroke: #aab5c0; stroke-width: 2.5; marker-end: url(#arrow); }
      .divider { stroke: #dbe2e8; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1500" height="820" fill="#ffffff"/>

  <!-- Research question -->
  <text x="50" y="69" class="header">TYDE research question</text>
  <rect x="268" y="35" width="730" height="52" rx="26" fill="#f3f6f9" stroke="#d4dde6" stroke-width="2"/>
  <text x="297" y="69" class="title">Which interactions should modify persistent state?</text>
  <line x1="50" y1="112" x2="1450" y2="112" class="divider"/>

  <!-- Column labels -->
  <text x="440" y="151" class="header" text-anchor="middle">interaction</text>
  <text x="725" y="151" class="header" text-anchor="middle">selective update</text>
  <text x="1035" y="151" class="header" text-anchor="middle">persistent representation</text>
  <text x="1325" y="151" class="header" text-anchor="middle">result</text>

  <!-- Row 1: irrelevant dialogue -->
  <text x="54" y="225" class="row-title">Irrelevant dialogue</text>
  <text x="54" y="255" class="subtitle">no durable signal</text>

  <rect x="335" y="191" width="240" height="68" rx="16" fill="#eef4ff" stroke="#6d88bc" stroke-width="2" filter="url(#soft-shadow)"/>
  <text x="455" y="219" class="node" text-anchor="middle">“I watched a movie”</text>
  <text x="455" y="243" class="node-small" text-anchor="middle">casual dialogue</text>

  <path d="M575 225 H643" class="arrow"/>
  <rect x="655" y="193" width="138" height="64" rx="14" fill="#fff7f5" stroke="#df8d84" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M682 207 L718 243 M718 207 L682 243" stroke="#c84d43" stroke-width="4" stroke-linecap="round"/>
  <text x="758" y="230" class="node-small" text-anchor="middle">no write</text>

  <path d="M793 225 H892" class="arrow"/>
  <rect x="904" y="193" width="250" height="64" rx="14" fill="#f7f8fa" stroke="#c9d2db" stroke-width="2"/>
  <text x="1029" y="219" class="node" text-anchor="middle">state unchanged</text>
  <text x="1029" y="243" class="node-small" text-anchor="middle">memory length unchanged</text>

  <path d="M1154 225 H1230" class="arrow"/>
  <text x="1325" y="232" class="result" text-anchor="middle">plan preserved</text>

  <line x1="50" y1="330" x2="1450" y2="330" class="divider"/>

  <!-- Row 2: state replacement -->
  <text x="54" y="411" class="row-title">State replacement</text>
  <text x="54" y="441" class="subtitle">current fact replaces obsolete fact</text>

  <rect x="336" y="376" width="104" height="66" rx="14" fill="#fff7f5" stroke="#df8d84" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="388" y="414" class="node-small" text-anchor="middle">Guangzhou</text>
  <path d="M355 389 L421 429 M421 389 L355 429" stroke="#c84d43" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M440 409 H472" class="arrow"/>
  <rect x="484" y="376" width="112" height="66" rx="14" fill="#eef8f7" stroke="#4f918b" stroke-width="2" filter="url(#soft-shadow)"/>
  <text x="540" y="414" class="node" text-anchor="middle">Hong Kong</text>
  <text x="466" y="466" class="caption" text-anchor="middle">new fact replaces old fact</text>

  <path d="M596 409 H654" class="arrow"/>
  <rect x="666" y="376" width="140" height="66" rx="14" fill="#fff6e6" stroke="#c9973e" stroke-width="2" filter="url(#soft-shadow)"/>
  <text x="736" y="403" class="node" text-anchor="middle">replace</text>
  <text x="736" y="427" class="node-small" text-anchor="middle">typed location</text>

  <path d="M806 409 H892" class="arrow"/>
  <rect x="904" y="368" width="250" height="82" rx="16" fill="#eef4ff" stroke="#6d88bc" stroke-width="2" filter="url(#soft-shadow)"/>
  <text x="1029" y="399" class="node" text-anchor="middle">Current state</text>
  <text x="1029" y="426" class="node-small" text-anchor="middle">location: Hong Kong</text>

  <path d="M1154 409 H1230" class="arrow"/>
  <text x="1325" y="401" class="result" text-anchor="middle">action uses</text>
  <text x="1325" y="430" class="result" text-anchor="middle">Hong Kong</text>

  <line x1="50" y1="525" x2="1450" y2="525" class="divider"/>

  <!-- Row 3: project update, highlighted -->
  <rect x="25" y="542" width="1450" height="174" rx="24" fill="#f3faf6"/>
  <text x="54" y="604" class="row-title-green">Project-aware update</text>
  <text x="54" y="634" class="subtitle">material-change gating</text>

  <rect x="335" y="570" width="240" height="74" rx="16" fill="#f2f5fb" stroke="#778eb8" stroke-width="2" filter="url(#soft-shadow)"/>
  <text x="455" y="601" class="node" text-anchor="middle">paper deadline</text>
  <text x="455" y="627" class="node-small" text-anchor="middle">→ 2026-09-05</text>

  <path d="M575 607 H626" class="arrow"/>
  <rect x="638" y="561" width="192" height="92" rx="18" fill="#ffffff" stroke="#aebdca" stroke-width="2"/>
  <rect x="652" y="575" width="72" height="50" rx="12" fill="#eef8f0" stroke="#6c9968" stroke-width="2"/>
  <text x="688" y="605" class="node-small" text-anchor="middle">route</text>
  <path d="M724 600 H747" class="arrow"/>
  <rect x="758" y="575" width="58" height="50" rx="12" fill="#fff6e6" stroke="#c9973e" stroke-width="2"/>
  <text x="787" y="605" class="node-small" text-anchor="middle">gate</text>
  <text x="734" y="678" class="caption" text-anchor="middle">project scope + material impact</text>

  <path d="M830 607 H892" class="arrow"/>
  <rect x="904" y="561" width="250" height="92" rx="16" fill="#f5effa" stroke="#8b70ad" stroke-width="2" filter="url(#soft-shadow)"/>
  <text x="1029" y="594" class="node" text-anchor="middle">Project state</text>
  <text x="1029" y="620" class="node-small" text-anchor="middle">deadline: 2026-09-05</text>
  <text x="1029" y="641" class="node-small" text-anchor="middle">+ provenance record</text>

  <path d="M1154 607 H1230" class="arrow"/>
  <text x="1325" y="599" class="result-green" text-anchor="middle">plan revises</text>
  <text x="1325" y="630" class="result-green" text-anchor="middle">with latest state</text>

  <!-- Legend -->
  <line x1="50" y1="744" x2="1450" y2="744" class="divider"/>
  <rect x="275" y="770" width="24" height="24" rx="6" fill="#eef4ff" stroke="#6d88bc" stroke-width="2"/>
  <text x="311" y="789" class="header">Interaction</text>
  <rect x="470" y="770" width="24" height="24" rx="6" fill="#eef8f0" stroke="#6c9968" stroke-width="2"/>
  <text x="506" y="789" class="header">Project route</text>
  <rect x="686" y="770" width="24" height="24" rx="6" fill="#fff6e6" stroke="#c9973e" stroke-width="2"/>
  <text x="722" y="789" class="header">Update gate</text>
  <rect x="890" y="770" width="24" height="24" rx="6" fill="#f5effa" stroke="#8b70ad" stroke-width="2"/>
  <text x="926" y="789" class="header">Project state</text>
  <rect x="1100" y="770" width="24" height="24" rx="6" fill="#eef8f7" stroke="#4f918b" stroke-width="2"/>
  <text x="1136" y="789" class="header">User state</text>
</svg>
